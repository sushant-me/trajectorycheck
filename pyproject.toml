[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectorycheck"
version = "0.1.1"
description = "Trajectory-level evaluation for AI agents — grades tool calls, arguments, side effects, and determinism, not just the final answer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
trajectorycheck = "trajectorycheck.cli:main"

[tool.setuptools.packages.find]
include = ["trajectorycheck*"]
